apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculadora-deployment
spec:
  replicas: 3 # REPLICACAO: 3 instancias em execucao
  selector:
    matchLabels:
      app: calculadora
  template:
    metadata:
      labels:
        app: calculadora
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: calculadora
          # A tag e trocada pelo pipeline de CD (kubectl set image).
          image: ghcr.io/gaveta-cmd/integracao-continua-devops:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: PORT
            - name: HISTORICO_PATH
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: HISTORICO_PATH
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: ADMIN_TOKEN
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: historico-storage
              mountPath: /data
      volumes:
        - name: historico-storage
          persistentVolumeClaim:
            claimName: historico-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: calculadora-service
spec:
  type: NodePort
  selector:
    app: calculadora
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080 # Exposicao externa
