name: Pipeline CD - GHCR e Deploy

# Dispara ao criar uma tag de versao semantica (ex: v1.0.0).
# Tambem pode ser executado manualmente informando uma versao ja publicada:
# isso e o ROLLBACK (reimplanta a versao estavel anterior). Ver docs/ROLLBACK.md.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versao ja publicada para implantar (ex: 1.0.0, sem o v)'
        required: true

permissions:
  contents: read

jobs:
  testes:
    # So publica imagem se o codigo passar no linter e nos testes.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: flake8 src/ tests/
      - run: pytest tests/ -v

  publish:
    needs: testes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # permite publicar no GHCR com o GITHUB_TOKEN
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Login no GHCR (GITHUB_TOKEN, sem senha guardada)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar tags (semver + sha do commit)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-homologacao:
    # Roda apos publicar, ou direto no rollback manual (publish ignorado).
    needs: [testes, publish]
    if: >-
      ${{ !cancelled()
      && needs.testes.result != 'failure'
      && needs.publish.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      VERSION: ${{ needs.publish.outputs.version || inputs.version }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Validar versao e segredo
        run: |
          if [ -z "$VERSION" ]; then
            echo "::error::Versao vazia. Use uma tag vX.Y.Z ou informe a versao no rollback."
            exit 1
          fi
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "::error::Crie o secret ADMIN_TOKEN em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Subir cluster de homologacao (kind, efemero)
        uses: helm/kind-action@v1
        with:
          cluster_name: homologacao

      - name: Login no GHCR e baixar a imagem da versao
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${VERSION}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "${IMAGE}"
          kind load docker-image "${IMAGE}" --name homologacao

      - name: Criar Secret a partir do GitHub Secrets (nunca no Git)
        run: |
          kubectl create secret generic app-secret \
            --from-literal=ADMIN_TOKEN="${ADMIN_TOKEN}"

      - name: Aplicar manifestos e trocar a tag da imagem
        run: |
          kubectl apply -f k8s/
          kubectl set image deployment/calculadora-deployment calculadora="${IMAGE}"
          kubectl rollout status deployment/calculadora-deployment --timeout=180s

      - name: Teste de fumaca (healthcheck)
        run: |
          kubectl port-forward service/calculadora-service 8080:8080 &
          sleep 5
          curl -fsS http://127.0.0.1:8080/healthz

      - name: Diagnostico em caso de falha
        if: failure()
        run: |
          kubectl get pods,svc,pvc
          kubectl describe deployment calculadora-deployment
          kubectl logs -l app=calculadora --tail=50
