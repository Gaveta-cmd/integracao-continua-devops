<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora DevOps</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0f0f13;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 1rem;
    }

    .app {
      display: flex;
      gap: 1.2rem;
      align-items: flex-start;
    }

    /* ── CALCULADORA ──────────────────────────── */
    .calc {
      background: #1a1a24;
      border: 1px solid #2a2a38;
      border-radius: 20px;
      padding: 1.5rem;
      width: 320px;
      box-shadow: 0 24px 64px rgba(0,0,0,.6);
    }

    .display {
      background: #0f0f13;
      border-radius: 12px;
      padding: 1.2rem 1.2rem 0.8rem;
      margin-bottom: 1.2rem;
      min-height: 96px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      gap: 4px;
      border: 1px solid #222230;
    }

    .display-expr {
      font-size: 13px;
      color: #55556a;
      min-height: 18px;
      word-break: break-all;
      text-align: right;
    }

    .display-value {
      font-size: 2.6rem;
      font-weight: 300;
      color: #e8e8f0;
      letter-spacing: -1px;
      word-break: break-all;
      text-align: right;
      line-height: 1;
    }

    .display-value.error { color: #ff6b6b; font-size: 1.4rem; }

    /* ── GRID DE BOTÕES ───────────────────────── */
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 500;
      cursor: pointer;
      height: 60px;
      transition: transform 80ms, filter 80ms;
      outline: none;
    }

    button:active { transform: scale(.93); filter: brightness(.85); }

    .btn-num {
      background: #23232f;
      color: #d8d8e8;
    }
    .btn-num:hover { background: #2c2c3c; }

    .btn-op {
      background: #2d2040;
      color: #a78bfa;
      font-size: 1.3rem;
    }
    .btn-op:hover { background: #3a2a54; }

    .btn-equals {
      background: #5b3ef8;
      color: #fff;
      font-size: 1.4rem;
      grid-column: span 2;
    }
    .btn-equals:hover { background: #6d4ff9; }

    .btn-clear {
      background: #3a1a1a;
      color: #f87171;
    }
    .btn-clear:hover { background: #4a2020; }

    .btn-del {
      background: #1e2a3a;
      color: #60a5fa;
    }
    .btn-del:hover { background: #253345; }

    .btn-zero { grid-column: span 2; }

    /* ── HISTÓRICO ────────────────────────────── */
    .history {
      background: #1a1a24;
      border: 1px solid #2a2a38;
      border-radius: 20px;
      padding: 1.2rem;
      width: 220px;
      max-height: 440px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 24px 64px rgba(0,0,0,.6);
    }

    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.8rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid #2a2a38;
    }

    .history-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #55556a;
    }

    .history-clear-btn {
      font-size: 10px;
      color: #55556a;
      background: none;
      border: none;
      cursor: pointer;
      height: auto;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 500;
      letter-spacing: .04em;
    }
    .history-clear-btn:hover { color: #f87171; background: #3a1a1a; }
    .history-clear-btn:active { transform: none; }

    .history-list {
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .history-list::-webkit-scrollbar { width: 4px; }
    .history-list::-webkit-scrollbar-track { background: transparent; }
    .history-list::-webkit-scrollbar-thumb { background: #2a2a38; border-radius: 2px; }

    .history-item {
      background: #0f0f13;
      border: 1px solid #222230;
      border-radius: 10px;
      padding: 0.6rem 0.8rem;
      cursor: pointer;
      transition: border-color 120ms, background 120ms;
    }

    .history-item:hover {
      border-color: #5b3ef8;
      background: #16102a;
    }

    .history-item-expr {
      font-size: 11px;
      color: #55556a;
      margin-bottom: 2px;
    }

    .history-item-result {
      font-size: 1.05rem;
      font-weight: 600;
      color: #a78bfa;
    }

    .history-empty {
      color: #35354a;
      font-size: 12px;
      text-align: center;
      padding: 2rem 0;
      line-height: 1.7;
    }

    /* ── RESPONSIVE ────────────────────────────── */
    @media (max-width: 580px) {
      .app { flex-direction: column; align-items: center; }
      .history { width: 320px; max-height: 200px; }
    }
  </style>
</head>
<body>

<div class="app">

  <!-- CALCULADORA -->
  <div class="calc">
    <div class="display">
      <div class="display-expr" id="expr"></div>
      <div class="display-value" id="display">0</div>
    </div>

    <div class="buttons">
      <button class="btn-clear" onclick="clearAll()">AC</button>
      <button class="btn-del"   onclick="deleteLast()">⌫</button>
      <button class="btn-del"   onclick="inputPercent()">%</button>
      <button class="btn-op"    onclick="inputOp('÷')">÷</button>

      <button class="btn-num" onclick="inputNum('7')">7</button>
      <button class="btn-num" onclick="inputNum('8')">8</button>
      <button class="btn-num" onclick="inputNum('9')">9</button>
      <button class="btn-op"  onclick="inputOp('×')">×</button>

      <button class="btn-num" onclick="inputNum('4')">4</button>
      <button class="btn-num" onclick="inputNum('5')">5</button>
      <button class="btn-num" onclick="inputNum('6')">6</button>
      <button class="btn-op"  onclick="inputOp('−')">−</button>

      <button class="btn-num" onclick="inputNum('1')">1</button>
      <button class="btn-num" onclick="inputNum('2')">2</button>
      <button class="btn-num" onclick="inputNum('3')">3</button>
      <button class="btn-op"  onclick="inputOp('+')">+</button>

      <button class="btn-num btn-zero" onclick="inputNum('0')">0</button>
      <button class="btn-num" onclick="inputDot()">.</button>
      <button class="btn-equals" onclick="calculate()">=</button>
    </div>
  </div>

  <!-- HISTÓRICO -->
  <div class="history">
    <div class="history-header">
      <span class="history-title">Histórico</span>
      <button class="history-clear-btn" onclick="clearHistory()">Limpar</button>
    </div>
    <div class="history-list" id="historyList">
      <div class="history-empty" id="emptyMsg">Nenhum cálculo<br>realizado ainda</div>
    </div>
  </div>

</div>

<script>
  /* ── Estado ───────────────────────────────── */
  let current  = '0';
  let operator = null;
  let operand  = null;
  let justCalc = false;
  let exprStr  = '';

  const display  = document.getElementById('display');
  const exprEl   = document.getElementById('expr');
  const histList = document.getElementById('historyList');
  const emptyMsg = document.getElementById('emptyMsg');

  /* ── Histórico (localStorage + futuro: API) ── */
  // TODO: substituir por chamada à API do Adrian
  // fetch('/api/history').then(r => r.json()).then(renderHistory)
  let history = JSON.parse(localStorage.getItem('calc_history') || '[]');
  renderHistory();

  function saveHistory(expr, result) {
    history.unshift({ expr, result, ts: Date.now() });
    if (history.length > 20) history.pop();
    localStorage.setItem('calc_history', JSON.stringify(history));

    // TODO: salvar no backend
    // fetch('/api/history', { method: 'POST', headers: {'Content-Type':'application/json'},
    //   body: JSON.stringify({ expression: expr, result }) });

    renderHistory();
  }

  function renderHistory() {
    if (history.length === 0) {
      emptyMsg.hidden = false;
      Array.from(histList.querySelectorAll('.history-item')).forEach(e => e.remove());
      return;
    }
    emptyMsg.hidden = true;
    histList.querySelectorAll('.history-item').forEach(e => e.remove());
    history.forEach(item => {
      const div = document.createElement('div');
      div.className = 'history-item';
      div.innerHTML = `
        <div class="history-item-expr">${item.expr}</div>
        <div class="history-item-result">${item.result}</div>`;
      div.addEventListener('click', () => loadFromHistory(item.result));
      histList.appendChild(div);
    });
  }

  function loadFromHistory(result) {
    current  = String(result);
    operator = null;
    operand  = null;
    justCalc = true;
    exprStr  = '';
    updateDisplay();
  }

  function clearHistory() {
    history = [];
    localStorage.removeItem('calc_history');
    renderHistory();
  }

  /* ── Display ──────────────────────────────── */
  function updateDisplay(value) {
    const val = value !== undefined ? value : current;
    display.textContent = val;
    display.className = 'display-value' + (val === 'Erro' ? ' error' : '');
    exprEl.textContent = exprStr;
  }

  /* ── Input ────────────────────────────────── */
  function inputNum(n) {
    if (justCalc) { current = n; justCalc = false; }
    else current = current === '0' ? n : current + n;
    if (current.length > 14) return;
    updateDisplay();
  }

  function inputDot() {
    if (justCalc) { current = '0.'; justCalc = false; updateDisplay(); return; }
    if (!current.includes('.')) { current += '.'; updateDisplay(); }
  }

  function inputOp(op) {
    justCalc = false;
    if (operator && operand !== null) calculate(true);
    operand  = parseFloat(current);
    operator = op;
    exprStr  = current + ' ' + op;
    justCalc = true;
    updateDisplay();
  }

  function inputPercent() {
    current = String(parseFloat(current) / 100);
    updateDisplay();
  }

  function deleteLast() {
    if (justCalc) return;
    current = current.length > 1 ? current.slice(0,-1) : '0';
    updateDisplay();
  }

  function clearAll() {
    current = '0'; operator = null; operand = null; justCalc = false; exprStr = '';
    updateDisplay();
  }

  /* ── Cálculo ──────────────────────────────── */
  function calculate(silent = false) {
    if (operator === null || operand === null) return;
    const b = parseFloat(current);
    const a = operand;
    let result;
    const fullExpr = `${a} ${operator} ${b}`;

    switch(operator) {
      case '+': result = a + b; break;
      case '−': result = a - b; break;
      case '×': result = a * b; break;
      case '÷':
        if (b === 0) { updateDisplay('Erro'); exprStr = fullExpr; exprEl.textContent = exprStr; return; }
        result = a / b;
        break;
    }

    // Arredonda ponto flutuante
    result = Math.round(result * 1e10) / 1e10;

    if (!silent) {
      exprStr = fullExpr + ' =';
      saveHistory(fullExpr, result);
      exprEl.textContent = exprStr;
    }

    current  = String(result);
    operator = null;
    operand  = null;
    justCalc = !silent;
    updateDisplay();
  }

  /* ── Teclado ──────────────────────────────── */
  document.addEventListener('keydown', e => {
    if (e.key >= '0' && e.key <= '9') inputNum(e.key);
    else if (e.key === '.')  inputDot();
    else if (e.key === '+')  inputOp('+');
    else if (e.key === '-')  inputOp('−');
    else if (e.key === '*')  inputOp('×');
    else if (e.key === '/')  { e.preventDefault(); inputOp('÷'); }
    else if (e.key === '%')  inputPercent();
    else if (e.key === 'Enter' || e.key === '=') calculate();
    else if (e.key === 'Backspace') deleteLast();
    else if (e.key === 'Escape')    clearAll();
  });
</script>
</body>
</html>
